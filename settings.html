<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leafie — Settings</title>

<style>
:root{
  --bg:#f3fbf3;
  --panel:#ffffff;
  --green:#66bb6a;
  --dark:#0f1720;
  --shadow:0 4px 10px rgba(30,80,50,0.06);
}

html,body{height:100%;}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--dark);
  display:flex;
}

.sidebar{
  width:220px;
  background:#eaf6ea;
  padding:28px 20px;
}

main{flex:1;padding:28px;}
.page-title{font-size:28px;font-weight:800;margin-bottom:18px;}

.card{
  background:var(--panel);
  border-radius:10px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.big-btn{
  padding:12px 18px;
  background:var(--green);
  color:white;
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}

.big-btn[disabled]{
  background:#cfcfcf;
}

.conn-status{
  font-size:13px;
  color:#31708f;
  margin-bottom:12px;
}

.switch{
  width:50px;
  height:28px;
  background:#e6f2e7;
  border-radius:999px;
  position:relative;
  cursor:pointer;
}

.switch .knob{
  width:22px;
  height:22px;
  background:white;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:.2s;
}

.switch.on{
  background:var(--green);
}

.switch.on .knob{
  left:25px;
}

input[type=range]{
  width:100%;
}
</style>
</head>

<body>

<main>
  <div class="page-title">Settings</div>

  <!-- CONNECTION -->
  <div class="card">
    <h3>Connection</h3>
    <div id="connStatus" class="conn-status">Disconnected</div>
    <button id="connectBtn" class="big-btn">📡 Connect</button>
  </div>

  <!-- WATERING -->
  <div class="card">
    <h3>Watering Settings</h3>

    <label>Automatic Watering</label>
    <div id="autoSwitch" class="switch">
      <div class="knob"></div>
    </div>

    <br><br>

    <label>
      Moisture Threshold:
      <strong><span id="thresholdLabel">40%</span></strong>
    </label>
    <input id="threshold" type="range" min="0" max="100" value="40">

    <br><br>

    <button id="sendBtn" class="big-btn">
      💧 Send threshold to micro:bit
    </button>
  </div>
</main>

<script>
/* =========================
   GLOBALS
========================= */
let usbDevice = null;
let device, server, service, characteristic;

const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

const connectBtn = document.getElementById('connectBtn');
const connStatus = document.getElementById('connStatus');
const thresholdEl = document.getElementById('threshold');
const thresholdLabel = document.getElementById('thresholdLabel');
const autoSwitch = document.getElementById('autoSwitch');
const sendBtn = document.getElementById('sendBtn');

/* =========================
   CONNECT (USB → BLE)
========================= */
connectBtn.addEventListener('click', async ()=>{
  try{
    connStatus.textContent = 'Searching for micro:bit...';

    if(navigator.usb){
      const devices = await navigator.usb.getDevices();
      usbDevice = devices.find(d => /micro/i.test(d.productName || ''));

      if(!usbDevice){
        usbDevice = await navigator.usb.requestDevice({
          filters:[{vendorId:0x0D28}]
        });
      }

      if(usbDevice){
        await usbDevice.open();
        if(usbDevice.configuration === null){
          await usbDevice.selectConfiguration(1);
        }
        await usbDevice.claimInterface(4);

        connStatus.textContent = 'Connected via USB';
        connectBtn.disabled = true;
        return;
      }
    }

    // BLE fallback
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[SERVICE_UUID]
    });

    server = await device.gatt.connect();
    service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

    connStatus.textContent = 'Connected via Bluetooth';
    connectBtn.disabled = true;

  }catch(err){
    connStatus.textContent = 'Connection failed';
    console.error(err);
  }
});

/* =========================
   SEND TO MICRO:BIT
========================= */
async function sendSettingsToMicrobit(){
  const threshold = thresholdEl.value;
  const auto = autoSwitch.classList.contains('on') ? 1 : 0;
  const message = `T:${threshold},A:${auto}!`;

  const data = new TextEncoder().encode(message);

  try{
    if(usbDevice && usbDevice.opened){
      await usbDevice.transferOut(1, data);
      alert('Sent via USB ✔');
    }else if(characteristic){
      await characteristic.writeValue(data);
      alert('Sent via Bluetooth ✔');
    }else{
      alert('No micro:bit connected');
    }
  }catch(err){
    console.error(err);
    alert('Send failed');
  }
}

/* =========================
   UI EVENTS
========================= */
thresholdEl.addEventListener('input', ()=>{
  thresholdLabel.textContent = thresholdEl.value + '%';
});

autoSwitch.addEventListener('click', ()=>{
  autoSwitch.classList.toggle('on');
});

sendBtn.addEventListener('click', sendSettingsToMicrobit);
</script>

</body>
</html>
